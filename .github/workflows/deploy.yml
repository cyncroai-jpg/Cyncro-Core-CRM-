name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/cyncro-crm-demo-d7e39w
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:ci

      - name: Create D1 database (skips if already exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2685fddc3c8d342a98b1adb6a13912ef
        run: |
          # Create the database — wrangler exits 0 if it already exists
          npx wrangler d1 create cyncro-core 2>&1 || true

          # Get the database_id from Cloudflare
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | \
            node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
            const db=JSON.parse(d).find(x=>x.name==='cyncro-core'); \
            console.log(db?.uuid||db?.id||'')")

          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not find D1 database ID. Check that CLOUDFLARE_API_TOKEN has D1 permissions."
            exit 1
          fi

          echo "D1 database ID: $DB_ID"
          # Patch wrangler.toml with the real ID
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "Updated wrangler.toml with database_id = $DB_ID"

      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2685fddc3c8d342a98b1adb6a13912ef
        run: |
          # Push each secret — skips if the value is empty
          push_secret() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping $name (not set in GitHub secrets)"
            fi
          }
          push_secret RESEND_API_KEY      "${{ secrets.RESEND_API_KEY }}"
          push_secret SERPER_API_KEY      "${{ secrets.SERPER_API_KEY }}"
          push_secret ANTHROPIC_API_KEY   "${{ secrets.ANTHROPIC_API_KEY }}"
          push_secret EMAIL_FROM          "${{ secrets.EMAIL_FROM }}"
          push_secret CRON_SECRET         "${{ secrets.CRON_SECRET }}"

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2685fddc3c8d342a98b1adb6a13912ef
        run: npx wrangler deploy
