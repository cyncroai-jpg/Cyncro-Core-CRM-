name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/cyncro-crm-demo-d7e39w
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:ci

      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2685fddc3c8d342a98b1adb6a13912ef
        run: |
          # Push each secret — skips if the value is empty
          push_secret() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping $name (not set in GitHub secrets)"
            fi
          }
          push_secret RESEND_API_KEY      "${{ secrets.RESEND_API_KEY }}"
          push_secret SERPER_API_KEY      "${{ secrets.SERPER_API_KEY }}"
          push_secret ANTHROPIC_API_KEY   "${{ secrets.ANTHROPIC_API_KEY }}"
          push_secret EMAIL_FROM          "${{ secrets.EMAIL_FROM }}"
          push_secret CRON_SECRET         "${{ secrets.CRON_SECRET }}"

      - name: Build
        run: npm run build

      - name: Patch generated wrangler config with real D1 database
        run: |
          node -e "
            const fs = require('fs');
            const path = 'dist/server/wrangler.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            // Replace any D1 binding named DB with our real database
            cfg.d1_databases = [{
              binding: 'DB',
              database_name: 'cyncro-core',
              database_id: 'c1aca1f5-a699-458a-95e7-7aa5b879e428'
            }];
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
            console.log('Patched dist/server/wrangler.json with real D1 database ID');
          "
          # Remove D1 from wrangler.toml so there is no duplicate binding
          node -e "
            const fs = require('fs');
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            toml = toml.replace(/\[\[d1_databases\]\][\s\S]*?(?=\n\[|\n#|\s*$)/, '');
            fs.writeFileSync('wrangler.toml', toml);
            console.log('Removed [[d1_databases]] from wrangler.toml');
          "

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2685fddc3c8d342a98b1adb6a13912ef
        run: npx wrangler deploy
