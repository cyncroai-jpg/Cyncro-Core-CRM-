name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/cyncro-crm-demo-d7e39w
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:ci

      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2685fddc3c8d342a98b1adb6a13912ef
        run: |
          # Push each secret — skips if the value is empty
          push_secret() {
            local name=$1
            local value=$2
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping $name (not set in GitHub secrets)"
            fi
          }
          push_secret RESEND_API_KEY      "${{ secrets.RESEND_API_KEY }}"
          push_secret SERPER_API_KEY      "${{ secrets.SERPER_API_KEY }}"
          push_secret ANTHROPIC_API_KEY   "${{ secrets.ANTHROPIC_API_KEY }}"
          push_secret EMAIL_FROM          "${{ secrets.EMAIL_FROM }}"
          push_secret CRON_SECRET         "${{ secrets.CRON_SECRET }}"

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2685fddc3c8d342a98b1adb6a13912ef
        run: npx wrangler deploy
